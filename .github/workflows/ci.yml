name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests del nucleo
        run: ./gradlew :nucleo:test --console=plain

      - name: Capturas de UI
        run: ./gradlew :app:testDebugUnitTest -Pcapturas=verificar --console=plain

      - name: Compilar release
        run: ./gradlew :app:compileReleaseKotlin --console=plain

      - name: Guardar reportes y diferencias visuales
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            nucleo/build/reports/tests/
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          retention-days: 7
